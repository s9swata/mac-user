name: Build macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set backend URL
        run: echo "VITE_BACKEND_URL=https://api.strategixinsightsadmin.tech" > .env

      - name: Build DMG Intel x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac:intel

      - name: Build DMG Apple Silicon arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac:apple

      - name: Upload Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: Strategixinsights-mac-intel
          path: release/*-x64.dmg
          retention-days: 30

      - name: Upload Apple Silicon DMG
        uses: actions/upload-artifact@v4
        with:
          name: Strategixinsights-mac-arm64
          path: release/*-arm64.dmg
          retention-days: 30